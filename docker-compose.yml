services:
  postgres:
    image: postgres:16-alpine
    container_name: work-governor-db
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - work-governor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-work_governor} -d $${POSTGRES_DB:-work_governor}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  work-governor-pgdata:
